name: Evidence reproduction

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: evidence-reproduction
  cancel-in-progress: false

jobs:
  bundles:
    name: Reproduce committed bundles
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.7"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test,data]"
      - name: Verify committed bundle contents
        run: python -m pytest tests/test_committed_bundles.py::test_every_committed_bundle_is_complete_and_content_verified
      - name: Reproduce all committed bundles
        run: python -m pytest -m reproduction tests/test_committed_bundles.py
