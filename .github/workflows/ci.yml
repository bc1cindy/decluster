name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test,data,scale]"
      - name: Run offline gate
        run: >-
          python -m pytest -m
          "not live and not reproduction${{ matrix.python-version == '3.10' && ' and not canonical' || '' }}"

  dss:
    name: Python 3.13 with pinned DSS
    runs-on: ubuntu-latest
    env:
      DSS_GIT_REV: d8099bc540c9de7d0f3c9f095e8b2aad8f9d8c8d
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Check out DSS
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: bc1cindy/dense-subset-sum
          ref: ${{ env.DSS_GIT_REV }}
          path: .ci/dense-subset-sum
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Select DSS minimum Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install project and DSS
        run: |
          python -m pip install --disable-pip-version-check ".[test,data,scale]"
          python -m pip install --disable-pip-version-check .ci/dense-subset-sum
      - name: Verify DSS revision
        run: python -c 'import dss, os; assert dss.__rev__ == os.environ["DSS_GIT_REV"]'
      - name: Run offline gate with DSS
        run: python -m pytest -m "not live and not reproduction"
